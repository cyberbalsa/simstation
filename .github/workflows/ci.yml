name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portable-core:
    name: Core / ${{ matrix.os }} / ${{ matrix.runtime }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            runtime: luajit
            lua_version: "luajit-2.1.0-beta3"
            require_luajit: true
          - os: windows-2025
            runtime: luajit
            lua_version: "luajit-2.1.0-beta3"
            require_luajit: true
          - os: macos-15-intel
            runtime: luajit
            lua_version: "luajit-2.1.0-beta3"
            require_luajit: true
          - os: macos-15
            runtime: lua-5.1
            lua_version: "5.1.5"
            require_luajit: false

    steps:
      - name: Check out source without media payloads
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Set up MSVC environment for LuaJIT
        if: runner.os == 'Windows'
        uses: step-security/msvc-dev-cmd@22c98154b708dbd743e6f27a933cf6ceba3305c4 # v1.13.1

      - name: Set up Lua runtime
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: ${{ matrix.lua_version }}

      - name: Diagnose required LuaJIT toolchain
        if: matrix.require_luajit
        run: python tools/dev.py doctor --format json --require luajit

      - name: Diagnose portable Lua toolchain
        if: matrix.require_luajit == false
        run: python tools/dev.py doctor --format json

      - name: Run deterministic core tests
        run: python tools/dev.py test

      - name: Verify cross-platform golden checkpoints
        run: python tools/dev.py benchmark smoke --golden required --min-tps 0 --output build/benchmarks/smoke-${{ runner.os }}-${{ matrix.runtime }}.json

      - name: Preserve benchmark report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-smoke-${{ runner.os }}-${{ matrix.runtime }}
          path: build/benchmarks/*.json
          if-no-files-found: warn
          retention-days: 14

  fast-gate:
    name: Audit and 100-crew gate
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out source without media payloads
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 1
          lfs: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11.9"
          check-latest: false

      - name: Set up LuaJIT
        uses: leafo/gh-actions-lua@6919171ccf181b826f44b9bca76307b577217377 # v13
        with:
          luaVersion: "luajit-2.1.0-beta3"

      - name: Run LFS-tolerant repository audit
        run: python tools/dev.py audit --assets auto

      - name: Enforce deterministic 192x192 / 100-crew gate
        run: python tools/dev.py benchmark ci --golden required --output build/benchmarks/ci.json

      - name: Preserve benchmark report
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: benchmark-ci-linux
          path: build/benchmarks/*.json
          if-no-files-found: warn
          retention-days: 14
